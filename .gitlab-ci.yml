stages:
  - publish
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA

publish_staging:
  image: docker:24.0.5
  stage: publish
  tags:
    - aiyou-staging
  only:
    - main
  before_script:
    - chmod +x ./automation/scripts/setup_env_staging.sh
    - ./automation/scripts/setup_env_staging.sh
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $TAG_COMMIT -t $TAG_LATEST -f ./auto/docker/Dockerfile.staging .
    - docker push $TAG_COMMIT
    - docker push $TAG_LATEST

deploy_staging:
  image: alpine:latest
  stage: deploy
  tags:
    - aiyou-staging
  only:
    - main
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $TAG_COMMIT
    - docker container rm -f $CONTAINER_NAME || true
    - docker run -d -p 3000:3000 --name $CONTAINER_NAME $TAG_COMMIT
