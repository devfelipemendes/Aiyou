stages:
  - publish
  - deploy
  - version

variables:
  DOCKER_DRIVER: overlay2
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA

build:
  image: docker:24.0.5
  stage: publish
  tags:
    - aiyou-staging
  only:
    - merge_requests
  before_script:
    - chmod +x ./auto/scripts/setup_env_ci.sh
    - ./auto/scripts/setup_env_ci.sh
  script:
    - docker build -t $TAG_COMMIT -t $TAG_LATEST -f ./auto/docker/Dockerfile .

publish_staging:
  image: docker:24.0.5
  stage: publish
  tags:
    - aiyou-staging
  only:
    - main
  before_script:
    - chmod +x ./auto/scripts/setup_env_staging.sh
    - ./auto/scripts/setup_env_staging.sh
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $TAG_COMMIT -t $TAG_LATEST -f ./auto/docker/Dockerfile .
    - docker push $TAG_COMMIT
    - docker push $TAG_LATEST

deploy_staging:
  image: docker:24.0.5
  stage: deploy
  tags:
    - aiyou-staging
  only:
    - main
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $TAG_COMMIT
    - docker container rm -f $CONTAINER_NAME || true
    - docker run -d -p 3000:3000 --name $CONTAINER_NAME --network aiyou-network $TAG_COMMIT

auto-version:
  stage: version
  image: node:18
  before_script:
    - chmod +x scripts/auto-version.sh
    - apt-get update -qq && apt-get install -y git
  script:
    - ./scripts/auto-version.sh
  artifacts:
    paths:
      - version.json
      - public/version.json
    expire_in: 1 day
  only:
    - main
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
